<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('게시판')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="text-3xl">게시판</h1>
    <p class="meta mt-2">B1-1 확인용 임시 화면입니다. 트리 모양으로 만드는 것은 B1-2 입니다.</p>

    <!-- 칸이 넷이라 폰에서는 옆으로 밀어 본다 -->
    <div class="card mt-6 overflow-x-auto">
        <table class="w-full text-left text-sm" th:unless="${categories.empty}">
            <thead class="border-b border-line text-ink-sub">
            <tr>
                <th class="px-4 py-3 font-medium">id</th>
                <th class="px-4 py-3 font-medium">parent_id</th>
                <th class="px-4 py-3 font-medium">이름</th>
                <th class="px-4 py-3 font-medium">순서</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-line-soft">
            <tr th:each="c : ${categories}">
                <td class="px-4 py-3 tabular-nums" th:text="${c.id}"></td>
                <td class="px-4 py-3 tabular-nums">
                    <span th:if="${c.parentId != null}" th:text="${c.parentId}"></span>
                    <span th:if="${c.parentId == null}" class="text-ink-muted">최상위</span>
                </td>
                <td class="px-4 py-3" th:text="${c.categoryName}"></td>
                <td class="px-4 py-3 tabular-nums" th:text="${c.displayOrder}"></td>
            </tr>
            </tbody>
        </table>

        <p th:if="${categories.empty}" class="meta px-5 py-6">
            카테고리가 없습니다. V9 가 적용됐는지 확인하세요.
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
