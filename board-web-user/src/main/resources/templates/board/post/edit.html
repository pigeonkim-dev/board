<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('글 수정')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-2xl px-4 py-8">
    <h1 class="text-3xl">글 수정</h1>

    <form class="card mt-6 space-y-5 p-5 sm:p-6" th:method="POST" th:action="@{/board/posts/{id}/edit(id=${post.id})}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
        <input type="hidden" name="page" th:value="${page}"/>

        <div>
            <label for="title" class="field-label">제목</label>
            <input type="text" id="title" class="input" name="title" th:value="${post.title}"/>
        </div>

        <div>
            <label for="content" class="field-label">본문</label>
            <textarea id="content" class="input leading-relaxed" name="content" rows="12"
                      th:text="${post.content}"></textarea>
        </div>

        <label class="flex items-center gap-2.5 text-ink-sub">
            <input class="checkbox" type="checkbox" id="commentsEnabled"
                   name="commentsEnabled" value="true" th:checked="${post.commentsEnabled}"/>
            댓글 받기
        </label>

        <div class="flex gap-2 pt-1">
            <button type="submit" class="btn btn-primary">수정 저장</button>
            <a class="btn btn-outline" th:href="@{/board/posts/{id}(id=${post.id}, page=${page})}">취소</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
