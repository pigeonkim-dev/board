<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('게시글 목록')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-6 flex items-end justify-between gap-4">
        <h1 class="text-3xl">게시글</h1>
        <a class="btn btn-primary" sec:authorize="isAuthenticated()" th:href="@{/board/posts/new}">새 글 쓰기</a>
    </div>

    <!-- 표 대신 줄 목록이다. 폰 폭에서 다섯 칸 표는 제목이 한두 글자로 잘린다.
         한 줄 = 제목(+댓글 수) 위, 작성자·날짜 아래. 글 번호는 넓은 화면에서만 왼쪽에 둔다. -->
    <ol class="card divide-y divide-line-soft" th:unless="${posts.empty}">
        <li th:each="post : ${posts.content}">
            <a class="flex gap-4 px-5 py-4 no-underline hover:bg-line-soft/50"
               th:href="@{/board/posts/{id}(id=${post.id}, page=${posts.number})}">
                <span class="hidden w-10 shrink-0 pt-0.5 text-right text-sm text-ink-muted tabular-nums sm:block"
                      th:text="${post.id}">1</span>
                <span class="min-w-0 flex-1">
                    <span class="flex items-baseline gap-2">
                        <span class="truncate text-[17px] font-semibold text-ink" th:text="${post.title}">제목</span>
                        <span class="shrink-0 text-sm text-ink-sub tabular-nums"
                              th:if="${post.commentCount > 0}"
                              th:text="'[' + ${post.commentCount} + ']'"
                              th:attr="aria-label='댓글 ' + ${post.commentCount} + '개'">[3]</span>
                    </span>
                    <span class="meta mt-1 flex gap-3">
                        <span th:text="${post.authorNickname}">작성자</span>
                        <time th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-29 12:00</time>
                    </span>
                </span>
            </a>
        </li>
    </ol>

    <div th:if="${posts.empty}" class="card px-5 py-14 text-center">
        <p class="text-ink-sub">아직 쓴 글이 없습니다.</p>
        <a class="btn btn-primary mt-5" sec:authorize="isAuthenticated()"
           th:href="@{/board/posts/new}">첫 글 쓰기</a>
        <a class="btn btn-outline mt-5" sec:authorize="isAnonymous()"
           th:href="@{/login}">로그인하고 글쓰기</a>
    </div>

    <nav class="mt-6 flex items-center justify-center gap-3" th:if="${posts.totalPages > 1}" aria-label="페이지 이동">
        <a class="page-link" th:classappend="${!posts.hasPrevious()} ? 'disabled'"
           th:attr="aria-disabled=${!posts.hasPrevious()}"
           th:href="@{/board/posts(page=${posts.number - 1})}">이전</a>
        <span class="meta tabular-nums" th:text="${(posts.number + 1) + ' / ' + posts.totalPages}">1 / 3</span>
        <a class="page-link" th:classappend="${!posts.hasNext()} ? 'disabled'"
           th:attr="aria-disabled=${!posts.hasNext()}"
           th:href="@{/board/posts(page=${posts.number + 1})}">다음</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
