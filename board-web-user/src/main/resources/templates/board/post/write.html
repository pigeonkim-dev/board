<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('새 글 쓰기')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-2xl px-4 py-8">
    <h1 class="text-3xl">새 글 쓰기</h1>

    <form class="card mt-6 space-y-5 p-5 sm:p-6" th:method="POST" th:action="@{/board/posts/new}" th:object="${postRequest}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

        <div>
            <label for="title" class="field-label">제목</label>
            <input type="text" id="title" class="input" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'field-error'"/>
            <p class="mt-1 text-sm text-danger"
               th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div>
            <label for="content" class="field-label">본문</label>
            <textarea id="content" class="input leading-relaxed" th:field="*{content}" rows="12"
                      th:classappend="${#fields.hasErrors('content')} ? 'field-error'"></textarea>
            <p class="mt-1 text-sm text-danger"
               th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
        </div>

        <label class="flex items-center gap-2.5 text-ink-sub">
            <input class="checkbox" type="checkbox" th:field="*{commentsEnabled}"/>
            댓글 받기
        </label>

        <div class="flex gap-2 pt-1">
            <button type="submit" class="btn btn-primary">글 올리기</button>
            <a class="btn btn-outline" th:href="@{/board/posts}">취소</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
