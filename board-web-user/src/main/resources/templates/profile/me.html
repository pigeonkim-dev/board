<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('내 정보')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="app-card p-4">
                <h1 class="h4 mb-4">내 정보</h1>

                <!-- 리다이렉트하면서 넘어온 일회성 메시지. 새로고침하면 사라진다. -->
                <div class="alert alert-success py-2" th:if="${message}" th:text="${message}"></div>

                <dl class="row mb-0">
                    <dt class="col-sm-3 text-secondary fw-normal">닉네임</dt>
                    <dd class="col-sm-9" th:text="${profile.nickname}">닉네임</dd>

                    <dt class="col-sm-3 text-secondary fw-normal">자기소개</dt>
                    <dd class="col-sm-9 mb-0">
                        <!-- 줄바꿈을 그대로 보여주려면 pre-wrap 이 필요하다.
                             th:text 는 HTML 을 이스케이프하므로 <br> 로는 안 된다. -->
                        <span th:if="${!#strings.isEmpty(profile.bio)}"
                              th:text="${profile.bio}" style="white-space: pre-wrap;">소개</span>
                        <span th:if="${#strings.isEmpty(profile.bio)}"
                              class="text-secondary">아직 작성하지 않았습니다.</span>
                    </dd>
                </dl>


                <hr class="my-4"/>

                <a class="btn btn-primary" th:href="@{/profile/me/edit}">수정</a>
                <a class="btn btn-outline-secondary" th:href="@{/board/posts}">목록으로</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
