<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('내 정보 수정')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-xl px-4 py-8">
    <h1 class="text-3xl">내 정보 수정</h1>

    <form class="card mt-6 space-y-5 p-5 sm:p-6" th:method="POST" th:action="@{/profile/me/edit}"
          th:object="${profileUpdateRequest}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

        <!-- 전역 에러 (닉네임 중복). 가입 폼과 같은 자리, 같은 방식.
             #fields 는 th:object 가 걸린 form 안에서만 동작한다. -->
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div>
            <label for="nickname" class="field-label">닉네임</label>
            <input type="text" id="nickname" class="input" th:field="*{nickname}"
                   th:classappend="${#fields.hasErrors('nickname')} ? 'field-error'"
                   placeholder="2~20자"/>
            <p class="mt-1 text-sm text-danger"
               th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
        </div>

        <div>
            <label for="bio" class="field-label">자기소개</label>
            <textarea id="bio" class="input leading-relaxed" th:field="*{bio}"
                      th:classappend="${#fields.hasErrors('bio')} ? 'field-error'"
                      rows="4" maxlength="256" placeholder="256자 이내"></textarea>
            <p class="mt-1 text-sm text-danger"
               th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></p>
        </div>

        <!-- 프로필 이미지는 B6-6 (업로드 + 저장소 선택)에서 붙는다. -->

        <div class="flex gap-2 pt-1">
            <button type="submit" class="btn btn-primary">저장</button>
            <a class="btn btn-outline" th:href="@{/profile/me}">취소</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
