<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- 사용자 사이트의 뼈대. web-common 의 login.html · error/business.html 도 아래 네 fragment 이름(head, navbar, footer, scripts)을 찾는다.
     CSS 는 /css/app.css 하나다 (2026-10-29 Tailwind 로 바꿈). 원본은 src/main/css/tailwind/app.css 이고 Gradle 이 빌드할 때 만든다.
     모양은 각 화면의 class 에 쓴다. 공통 부품(btn, input, card, alert)은 공통 테마에 있다. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Board'">Board</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"/>
    <!-- 제목(h1)과 로고 글꼴. 공통 테마의 --font-display 가 이 이름을 쓴다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<!-- 상단 띠. 폰(sm 미만)에서는 메뉴를 접고 '메뉴' 버튼으로 연다. 여는 스크립트는 아래 scripts fragment 에 있다. -->
<header th:fragment="navbar" class="border-b border-line bg-surface">
    <div class="mx-auto flex max-w-3xl flex-wrap items-center gap-x-6 px-4 py-3">
        <a class="logo" th:href="@{/}">Board</a>

        <button type="button" class="btn btn-outline ml-auto px-3 py-1.5 text-sm sm:hidden"
                data-menu-toggle aria-controls="site-menu" aria-expanded="false">메뉴</button>

        <nav id="site-menu" aria-label="사이트 메뉴"
             class="hidden w-full flex-col gap-1 pt-3 sm:flex sm:w-auto sm:flex-1 sm:flex-row sm:items-center sm:gap-5 sm:pt-0">
            <a class="nav-link" th:href="@{/board/posts}">게시판</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/board/posts/new}">글쓰기</a>

            <span class="hidden sm:block sm:flex-1"></span>

            <a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
            <!-- 로그인 객체는 BoardOidcUser 하나다. 가입 전(nickname 이 null)이면 sub 앞자리를 보여준다. -->
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/profile/me}">
                <strong class="font-semibold text-ink" th:with="p=${#authentication.principal}"
                        th:text="${p.nickname != null ? p.nickname : '#' + #strings.abbreviate(#authentication.name, 11)}">닉네임</strong>님
            </a>
            <form sec:authorize="isAuthenticated()" th:method="POST" th:action="@{/logout}" class="py-2 sm:py-0">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline px-3 py-1.5 text-sm">로그아웃</button>
            </form>
        </nav>
    </div>
</header>

<footer th:fragment="footer" class="mt-16 border-t border-line-soft">
    <p class="mx-auto max-w-3xl px-4 py-6 text-sm text-ink-muted">Board — Spring Boot 학습 프로젝트</p>
</footer>

<th:block th:fragment="scripts">
    <script>
      // 폰에서 상단 메뉴를 열고 닫는다. 버튼의 aria-expanded 를 같이 바꿔 화면 읽기 프로그램도 상태를 안다.
      document.querySelectorAll('[data-menu-toggle]').forEach(function (button) {
        var menu = document.getElementById(button.getAttribute('aria-controls'));
        button.addEventListener('click', function () {
          var open = menu.classList.toggle('hidden') === false;
          menu.classList.toggle('flex', open);
          button.setAttribute('aria-expanded', String(open));
        });
      });
    </script>
</th:block>

</body>
</html>
