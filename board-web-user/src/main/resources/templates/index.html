<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-3xl px-4 py-10 sm:py-16">
    <!-- 가입 완료 등 한 번만 보여줄 안내. 플래시 속성 message 가 있을 때만. -->
    <div class="alert alert-ok mb-8" th:if="${message}" th:text="${message}"></div>

    <!-- 폰(375px)에서도 두 줄로 끊기게 32px 로 시작한다. 40px 를 넘기면 "이야기합니다" 가 셋째 줄로 떨어진다 -->
    <h1 class="text-[2rem] leading-tight sm:text-6xl">글을 쓰고,<br/>댓글로 이야기합니다</h1>
    <p class="mt-5 max-w-xl text-lg leading-relaxed text-ink-sub">
        Spring Boot 로 만든 게시판입니다. 로그인은 OAuth2 IdP 계정 하나로 합니다.
    </p>

    <div class="mt-8 flex flex-wrap gap-3">
        <a class="btn btn-primary" th:href="@{/board/posts}">게시판 둘러보기</a>
        <a class="btn btn-outline" sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
        <a class="btn btn-outline" sec:authorize="isAuthenticated()" th:href="@{/board/posts/new}">글쓰기</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
