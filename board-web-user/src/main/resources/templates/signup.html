<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-sm px-4 py-12 sm:py-16">
    <h1 class="text-3xl">닉네임을 정해 주세요</h1>
    <p class="mt-3 leading-relaxed text-ink-sub">
        IdP 로그인은 끝났습니다. board 에서 쓸 닉네임 하나만 정하면 가입이 끝납니다.
    </p>

    <form class="card mt-6 space-y-5 p-5 sm:p-6" th:method="POST" th:action="@{/signup}" th:object="${profileSetupRequest}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

        <!-- 전역 에러 (닉네임 중복). profile/edit.html 과 같은 방식. -->
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div>
            <label for="nickname" class="field-label">닉네임</label>
            <input type="text" id="nickname" class="input" th:field="*{nickname}"
                   th:classappend="${#fields.hasErrors('nickname')} ? 'field-error'"
                   placeholder="2~20자" autofocus/>
            <p class="mt-1 text-sm text-danger"
               th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
        </div>

        <button type="submit" class="btn btn-primary w-full">가입 끝내기</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
