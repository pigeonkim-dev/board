# 사이트 고유값. 같은 127.0.0.1 에 8080·8081·9000 이 뜨므로 세션 쿠키 이름이 같으면 서로 덮어쓴다 (RFC 6265: 쿠키는 포트를 안 가린다).
server:
  servlet:
    session:
      cookie:
        name: BOARDSESSION

# 공통 LoginController 가 로그인 버튼 주소(/oauth2/authorization/{이 값})를 만들 때 읽는다. admin-web 은 board-admin.
board:
  oauth2:
    registration-id: board

spring:
  profiles:
    default: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # 물려받을 스키마가 없다. V1 부터 쌓는다
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  security:
    oauth2:
      client:
        registration:
          board:
            client-id: board-client
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid   # profile 은 뺐다 — IdP 가 profile 에 채우는 클레임이 없다 (10/4 확인). 받는 것은 sub 하나