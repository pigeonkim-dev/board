plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    // 테스트 전용 공유 코드(TestUsers)를 다른 모듈의 테스트가 가져다 쓰게 해 주는 플러그인.
    // src/testFixtures/java 에 둔 클래스가 testFixtures(project(':board-web-common')) 로 배포된다.
    // 보통 src/test 의 클래스는 모듈 밖으로 나가지 못한다 — 그래서 이 플러그인이 있다.
    id 'java-test-fixtures'
}

// core 와 같은 이유로 라이브러리다. 실행하지 않는다.
tasks.named('bootJar') { enabled = false }
tasks.named('jar') { enabled = true }

dependencies {
    implementation project(':board-core')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // TestUsers 가 쓰는 것: oidcLogin() 은 security-test, RequestPostProcessor 는 webmvc-test(spring-test)
    testFixturesImplementation project(':board-core')
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
