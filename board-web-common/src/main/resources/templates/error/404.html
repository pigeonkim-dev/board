<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- 없는 주소. Spring Boot 가 상태코드 이름으로 이 파일을 찾아 Whitelabel 대신 보여 준다. -->
<head th:replace="~{fragments/layout :: head('페이지를 찾을 수 없습니다')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-sm px-4 py-12 sm:py-16">
    <h1 class="text-3xl">페이지를 찾을 수 없습니다</h1>
    <p class="mt-3 leading-relaxed text-ink-sub">주소가 잘못되었거나 없어진 페이지입니다.</p>

    <div class="mt-6 flex gap-2">
        <a class="btn btn-primary" th:href="@{/}">홈으로</a>
        <a class="btn btn-outline" href="javascript:history.back()">이전 화면</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
