<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('요청을 처리하지 못했습니다')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-sm px-4 py-12 sm:py-16">
    <h1 class="text-3xl">요청을 처리하지 못했습니다</h1>
    <div class="alert alert-danger mt-6" th:text="${errorMessage}">이유</div>

    <div class="mt-6 flex gap-2">
        <a class="btn btn-primary" th:href="@{/}">홈으로</a>
        <a class="btn btn-outline" href="javascript:history.back()">이전 화면</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
