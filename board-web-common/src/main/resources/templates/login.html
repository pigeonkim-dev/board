<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- 사용자 사이트와 관리자 사이트가 같이 쓴다. 모양(head, navbar)은 각 사이트의 fragments/layout 이 정한다. -->
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-sm px-4 py-12 sm:py-16">
    <h1 class="text-3xl">로그인</h1>
    <p class="mt-3 leading-relaxed text-ink-sub">
        OAuth2 IdP 계정으로 로그인합니다. 계정이 없으면 IdP 로그인 화면에서 가입할 수 있습니다.
    </p>

    <div th:if="${param.error}" class="alert alert-danger mt-6">
        로그인하지 못했습니다. 다시 시도해 주세요.
    </div>

    <!-- 로그인 수단은 IdP 하나다. 실패하면 Spring 이 /login?error 로 돌려보낸다. -->
    <!-- registrationId 는 LoginController 가 yaml 에서 읽어 넣는다: user-web 은 board, admin-web 은 board-admin -->
    <a class="btn btn-primary mt-6 w-full" th:href="@{/oauth2/authorization/{id}(id=${registrationId})}">
        IdP 로 로그인
    </a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
