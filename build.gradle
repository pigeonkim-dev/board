// 루트에는 소스가 없다. 두 모듈의 공통 설정만 둔다.
//
// apply false 는 "플러그인의 버전만 정해두고 여기에는 적용하지 않는다"는 뜻이다.
// 각 모듈이 자기 build.gradle 에서 버전 없이 id 만 적어 가져다 쓴다.
// 버전을 한 곳에서만 관리하려는 것이다.
plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'

    group = 'com.pigeonkim'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
