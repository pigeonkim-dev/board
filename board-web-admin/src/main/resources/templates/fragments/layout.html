<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- admin-web 의 뼈대. web-common 의 login.html · error/business.html 이 아래 네 fragment 이름(head, navbar, footer, scripts)을 찾는다.
     이름이 곧 약속이다 — 사이트마다 layout 은 달라도 fragment 이름은 같아야 공통 템플릿이 돈다. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' · Board 관리'">Board 관리</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg admin-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Board <span class="badge text-bg-dark">관리</span></a>
        <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link" th:href="@{/login}">로그인</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <span class="nav-link" th:with="p=${#authentication.principal}"
                      th:text="${p.nickname != null ? p.nickname : '#' + #strings.abbreviate(#authentication.name, 11)}">닉네임</span>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:method="POST" th:action="@{/logout}" class="d-inline">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-light">로그아웃</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<footer th:fragment="footer" class="admin-footer py-4 mt-5">
    <div class="container text-center">
        <span>Board 관리 · 8081</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
