<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- admin-web 의 뼈대. web-common 의 login.html · error/business.html 이 아래 네 fragment 이름(head, navbar, footer, scripts)을 찾는다.
     이름이 곧 약속이다 — 사이트마다 layout 은 달라도 fragment 이름은 같아야 공통 템플릿이 돈다.
     CSS 는 /css/app.css 하나다 (2026-10-29 Tailwind 로 바꿈). 원본은 src/main/css/tailwind/app.css. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Board 관리'">Board 관리</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<!-- 관리자 사이트는 상단 띠에 경고색 '관리' 표시를 달아 사용자 사이트와 한눈에 구분한다.
     메뉴가 이름과 로그아웃 둘뿐이라 폰에서도 접는 메뉴가 필요 없다. -->
<header th:fragment="navbar" class="border-b border-line bg-surface">
    <div class="mx-auto flex max-w-5xl items-center gap-3 px-4 py-3">
        <a class="logo" th:href="@{/}">Board</a>
        <span class="admin-badge">관리</span>

        <span class="flex-1"></span>

        <a class="text-[15px] text-ink-sub no-underline hover:text-ink" sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
        <span class="hidden text-[15px] text-ink-sub sm:inline" sec:authorize="isAuthenticated()"
              th:with="p=${#authentication.principal}"
              th:text="${p.nickname != null ? p.nickname : '#' + #strings.abbreviate(#authentication.name, 11)}">닉네임</span>
        <form sec:authorize="isAuthenticated()" th:method="POST" th:action="@{/logout}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline px-3 py-1.5 text-sm">로그아웃</button>
        </form>
    </div>
</header>

<footer th:fragment="footer" class="mt-16 border-t border-line-soft">
    <p class="mx-auto max-w-5xl px-4 py-6 text-sm text-ink-muted">Board 관리 — 8081</p>
</footer>

<!-- 지금은 쓰는 스크립트가 없다. 공통 템플릿이 이 이름을 찾으므로 빈 fragment 를 둔다. -->
<th:block th:fragment="scripts"></th:block>

</body>
</html>
