<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="mx-auto max-w-5xl px-4 py-8">
    <h1 class="text-3xl">관리자 홈</h1>
    <p class="meta mt-2">P2-1 확인용. 로그인되어 있으면 상단 띠에 이름이 보인다. 게시판 관리는 P3 에서 여기 붙는다.</p>

    <dl class="card mt-6 divide-y divide-line-soft text-sm" sec:authorize="isAuthenticated()"
        th:with="p=${#authentication.principal}">
        <div class="grid gap-1 px-5 py-3 sm:grid-cols-[8rem_1fr]">
            <dt class="text-ink-sub">sub</dt>
            <dd class="break-all tabular-nums" th:text="${#authentication.name}">-</dd>
        </div>
        <div class="grid gap-1 px-5 py-3 sm:grid-cols-[8rem_1fr]">
            <dt class="text-ink-sub">registered</dt>
            <dd th:text="${p.registered}">-</dd>
        </div>
        <div class="grid gap-1 px-5 py-3 sm:grid-cols-[8rem_1fr]">
            <dt class="text-ink-sub">role</dt>
            <dd th:text="${p.role}">-</dd>
        </div>
    </dl>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
