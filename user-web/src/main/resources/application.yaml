spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/board
    username: ${DB_USERNAME}
    password: ""
    driver-class-name: org.postgresql.Driver

  # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # 물려받을 스키마가 없다. V1 부터 쌓는다

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # ── TODO 2-2  OAuth2 클라이언트 설정 ──────────────────────────────
  #
  # 아래 키 이름은 Spring 이 정해둔 것이라 그대로 쓴다. 값만 채운다.
  # 값의 출처는 IdP 의 SecurityConfig.java:216-228 (board-client 블록)이다.
  #
  # registration 아래의 이름(board)이 registrationId 다. 이것이 두 URL 에 들어간다:
  #   입구  /oauth2/authorization/board      ← login.html 의 버튼이 이미 이 주소를 가리킨다
  #   출구  /login/oauth2/code/board         ← IdP 에 등록된 redirectUri 와 같아야 한다
  # 그래서 이름을 바꾸면 양쪽을 다 바꿔야 한다.
  #
  security:
    oauth2:
      client:
        registration:
          board:
            # TODO IdP 가 아는 이 클라이언트의 이름
            client-id: board-client

            # TODO 비밀값. IdP 는 해시로 저장하고 있지만 우리는 평문을 보낸다
            #      ⚠️ 지금은 평문으로 둔다. 운영 전에 환경변수로 뺄 자리다
            client-secret: board-secret

            # TODO 비밀값을 '어떻게' 보낼지. IdP 쪽이 CLIENT_SECRET_BASIC 이다
            #      = HTTP Basic 헤더에 담는 방식. yaml 에는 스네이크케이스로 적는다
            client-authentication-method: client_secret_basic

            # TODO 어떤 흐름을 쓸지. 우리는 "코드를 받아 토큰으로 바꾸는" 방식이다
            authorization-grant-type: authorization_code

            # TODO IdP 가 되돌려보낼 주소.
            #      직접 쓰지 말고 자리표시자를 쓴다 — Spring 이 치환한다:
            #        {baseUrl}        → http://127.0.0.1:8080
            #        {registrationId} → board
            #      8081 로 한 번 더 띄울 때(선행 5일차) 이 줄을 안 고쳐도 되는 이유다
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

            # TODO IdP 에 요청할 범위. 둘이다.
            #      openid  이게 있어야 OIDC 가 된다 (= ID 토큰을 준다)
            #      profile IdP 의 board-client 에 등록된 또 하나
            scope: openid, profile

        provider:
          board:
            # TODO IdP 의 issuer. 기동할 때 여기에
            #      /.well-known/openid-configuration 을 붙여 원격 호출하고
            #      authorize·token·jwks·userinfo 주소를 한꺼번에 받아온다.
            #      ⚠️ localhost 가 아니라 127.0.0.1 이다. 섞이면 ID 토큰의
            #        iss 검증에서 깨진다 (IdP 가 issuer 를 고정해 뒀다)
            #      ⚠️ 이 한 줄 때문에 IdP 가 꺼져 있으면 board 가 안 뜬다
            issuer-uri: http://127.0.0.1:9000
