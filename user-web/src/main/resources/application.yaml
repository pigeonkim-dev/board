spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/board
    username: ${DB_USERNAME}
    password: ""
    driver-class-name: org.postgresql.Driver

  # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # 물려받을 스키마가 없다. V1 부터 쌓는다

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
