<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="auth-wrap">
        <div class="app-card p-4">
            <h1 class="h4 text-center mb-4">로그인</h1>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                로그인에 실패했습니다. 다시 시도해 주세요.
            </div>

            <!-- 로그인 수단은 IdP 하나다. 실패하면 Spring 이 /login?error 로 돌려보낸다. -->
            <a class="btn btn-primary w-100" th:href="@{/oauth2/authorization/board}">
                IdP 로 로그인
            </a>

            <p class="text-center text-secondary small mt-3 mb-0">
                계정이 없으면 IdP 로그인 화면에서 가입할 수 있습니다.
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
