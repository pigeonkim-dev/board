<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Board</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg brand-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Board</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu" aria-controls="navMenu"
                aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/board/posts}">게시판</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/board/posts/new}">글쓰기</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/member/login}">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/member/signup}">회원가입</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link me-1" th:href="@{/profile/me}">
                        <!--
                          선행 주간 한정 분기. board P1-5(10/22) 에서 지운다.

                          지금 로그인 경로가 둘이라 principal 타입도 둘이다.
                            폼로그인  CustomUserDetails  — getNickname() 이 있다
                            IdP       DefaultOidcUser    — 없다. 닉네임은 IdP 가 아니라
                                                           board 의 Profile 에 있으니까
                          예전에는 sec:authentication="principal.nickname" 한 줄이었는데,
                          IdP 로 들어오면 NotReadablePropertyException 으로 500 이 났다.
                          sec:authentication 은 안전 탐색(?.)이 없어서 막을 방법이 없다.

                          그래서 th:text 로 바꾸고 SpEL 로 타입을 본다.
                          #authentication 은 thymeleaf-extras-springsecurity 가 주는
                          표현식 객체다 (= SecurityContext 의 Authentication).
                          IdP 쪽은 name(= sub = publicId)을 앞 8자만 보여준다 — UUID 전체는 너무 길다.

                          P1-5 에서 BoardOidcUser 가 nickname 을 들고 오면
                          이 분기가 사라지고 principal.nickname 한 줄로 돌아간다.
                        -->
                        <strong th:text="${#authentication.principal
                                   instanceof T(com.pigeonkim.board.web.security.CustomUserDetails)
                                     ? #authentication.principal.nickname
                                     : '#' + #strings.abbreviate(#authentication.name, 11)}">닉네임</strong>님
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:method="POST" th:action="@{/logout}" class="d-inline">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary">로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="app-footer py-4 mt-5">
    <div class="container text-center">
        <span>Board · Spring Boot 학습 프로젝트</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
