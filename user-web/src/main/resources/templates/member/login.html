<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="auth-wrap">
        <div class="app-card p-4">
            <h1 class="h4 text-center mb-4">로그인</h1>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2">
                로그아웃되었습니다.
            </div>

            <form th:method="POST" th:action="@{/member/login}">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="username" class="form-label">이메일</label>
                    <input type="email" id="username" class="form-control" name="username"
                           placeholder="you@example.com"/>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" class="form-control" name="password"
                           placeholder="비밀번호"/>
                </div>
                <button type="submit" class="btn btn-primary w-100">로그인</button>
            </form>

            <!-- 선행 주간 2일차. board P1-5(10/22)에서 위 폼이 사라지고 이것만 남는다. -->
            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 m-0"/>
                <span class="px-2 text-secondary small">또는</span>
                <hr class="flex-grow-1 m-0"/>
            </div>

            <!--
              /oauth2/authorization/{registrationId} 는 Spring Security 가 고정으로 잡는 경로다.
              우리가 만드는 엔드포인트가 아니라 OAuth2AuthorizationRequestRedirectFilter 가 가로챈다.
              registrationId 는 application.yaml 의 registration 이름(board)과 같아야 한다.
              POST 가 아니라 평범한 링크(GET)다 — 여기서 IdP 로 리다이렉트만 일어난다.
            -->
            <a class="btn btn-outline-dark w-100" th:href="@{/oauth2/authorization/board}">
                IdP 로 로그인
            </a>

            <p class="text-center text-secondary small mt-3 mb-0">
                아직 계정이 없으신가요? <a th:href="@{/member/signup}">회원가입</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
