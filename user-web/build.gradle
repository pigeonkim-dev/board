plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // ★ 이 한 줄이 이번 태스크의 전부다.
    //
    // 화살표가 여기서 core 로만 간다. core/build.gradle 에는 user-web 이 없다.
    // 그래서 core 안에서 com.pigeonkim.board.web.* 을 import 하면 컴파일이 깨진다.
    // 규칙이 머릿속이 아니라 빌드 파일에 적히는 것이다.
    implementation project(':core')

    // core 가 implementation 으로 가진 것은 컴파일 시점에 여기로 넘어오지 않는다.
    // PostController 가 Page · Pageable 을 직접 쓰므로 여기서도 선언한다.
    // 각 모듈이 자기가 쓰는 것을 스스로 적는 편이 나중에 읽기 쉽다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    // TODO 2-1  OAuth2 클라이언트 스타터를 한 줄 추가한다.
    //
    //  이름을 조심한다. Boot 4.1 BOM 에는 비슷한 이름이 둘 있다 (직접 확인함):
    //    spring-boot-starter-oauth2-client
    //    spring-boot-starter-security-oauth2-client
    //  우리는 뒤쪽을 쓴다. 이 모듈이 이미 security- 접두 계열로 통일돼 있고
    //  (아래 testImplementation 들을 보라), 내용을 확인한 쪽이기도 하다.
    //
    //  이 스타터가 데려오는 것:
    //    spring-boot-starter-security            (이미 위에 있다)
    //    spring-boot-security-oauth2-client      ← 자동설정. Boot 4 는 모듈별로 쪼개져 있다
    //    spring-security-oauth2-jose             ← JWT 서명 검증 (ID 토큰을 푸는 데 쓴다)
    //
    //  왜 자동설정이 따로 필요한가: 라이브러리만 넣으면 클래스는 있는데
    //  application.yaml 의 spring.security.oauth2.client.* 를 읽어줄 사람이 없다.

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
